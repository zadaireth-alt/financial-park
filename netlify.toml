[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Permite que las imágenes ya publicadas se puedan volver a leer para
    # reconstruir el sitio en el navegador y republicar sin subir archivos.
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Cache "para siempre" a propósito: contenido.js referencia el video con
    # un "?v=" al final (ver decisión 25 en 01-DECISIONES.md). Para reemplazar
    # el video, se sube el archivo nuevo con el mismo nombre Y se sube ese
    # número — así nunca queda una versión vieja en caché.

